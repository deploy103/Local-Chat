services:
  local-chat:
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "8005"
      TRUST_PROXY: ${TRUST_PROXY:-1}
    expose:
      - "8005"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./uploads
        target: /app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8005/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mvtp-web-net

networks:
  mvtp-web-net:
    external: true
